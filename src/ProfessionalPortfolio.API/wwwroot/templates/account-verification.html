<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        body {
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .content {
            padding: 20px;
        }

        .otp-box {
            display: inline-block;
            background-color: #ddd;
            color: #222;
            font-weight: bold;
            font-size: 20px;
            padding: 12px 20px;
            border-radius: 6px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <p>Hello {{FirstName}},</p>
            <p>
                Thank you for registering with <strong>Professional Portfolio</strong>. To Complete your registration, please use the OTP below. This code is valid for <strong>{{validity}} minutes</strong>
            </p>
            <div class="otp-box">{{OTP}}</div>
        </div>
    </div>
</body>
</html>
