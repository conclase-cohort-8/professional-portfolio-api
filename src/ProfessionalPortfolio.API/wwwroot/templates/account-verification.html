<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
            color: #333333;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .content {
            padding: 30px;
        }

        h1 {
            color: #004aad;
            font-size: 22px;
            margin-top: 0;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
        }

        .otp-box {
            display: inline-block;
            background-color: #ddd;
            color: #222;
            font-weight: bold;
            font-size: 24px;
            letter-spacing: 4px;
            padding: 12px 24px;
            border-radius: 6px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <p>Hello {{FirstName}},</p>
            <p>Thank you for registering with <strong>Professional Portfolio.</strong>. To complete your registration, please use the OTP code below. This code is valid for <strong>{{validity}} minutes</strong>.</p>

            <div class="otp-box">{{OTP}}</div>
        </div>
    </div>
</body>
</html>
